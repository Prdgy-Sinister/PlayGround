<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#08131d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Dragon Rush — Race of Legends</title>
  <meta name="description" content="Saddle up and race across a world of islands, storms and legendary dragons. A stylised 3D dragon-racing adventure." />
  <link rel="preload" href="./assets/fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app">
    <div id="stage" aria-hidden="true"></div>

    <div id="boot" class="boot">
      <div class="boot-inner">
        <div class="crest big-crest" aria-hidden="true">
          <svg viewBox="0 0 100 100"><path class="crest-wing" d="M50 20 C32 8 14 12 6 26 c14 2 22 10 28 22 C24 44 12 50 6 64 c16-6 28-8 44-6 z"/><path class="crest-wing right" d="M50 20 C68 8 86 12 94 26 c-14 2-22 10-28 22 10-4 22 2 28 16 -16-6-28-8-44-6 z"/><path class="crest-body" d="M50 18 c-8 10-10 24-8 40 2 14 4 22 8 28 4-6 6-14 8-28 2-16 0-30-8-40z"/><circle cx="50" cy="30" r="3.4" class="crest-eye"/></svg>
        </div>
        <h1 class="logo-big">DRAGON <span>RUSH</span></h1>
        <p class="logo-sub">RACE OF LEGENDS</p>
        <div class="boot-bar"><i></i></div>
        <p id="boot-text" class="boot-text">Waking the dragons…</p>
      </div>
      <div class="boot-vignette"></div>
    </div>

    <div id="ui" class="ui" aria-live="polite">
      <header id="topbar" class="topbar">
        <div class="rider-card">
          <div class="rider-avatar" id="rider-avatar">W</div>
          <div class="rider-meta">
            <span class="rider-name" id="rider-name">Wren Skyborn</span>
            <span class="rider-level">RIDER <b id="rider-level">1</b></span>
            <div class="xp-mini"><i id="rider-xp"></i></div>
          </div>
        </div>
        <div class="top-actions">
          <div class="currency"><span class="coin-ico">◈</span><b id="cur-coins">0</b></div>
          <div class="currency gem"><span class="gem-ico">◆</span><b id="cur-gems">0</b></div>
          <button class="icon-btn" data-action="settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <main id="screen" class="screen"></main>

      <div id="hud" class="hud hidden"></div>
      <div id="modal-root" class="modal-root hidden"></div>
      <div id="toast-root" class="toast-root"></div>
      <nav id="bottomnav" class="bottomnav"></nav>
    </div>

    <div id="rotate" class="rotate hidden">
      <div class="rotate-icon">↻</div>
      <p>Turn your device sideways for the best view of the skies.</p>
    </div>
    <div id="fatal" class="fatal hidden"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script>
    window.addEventListener('error', function (e) {
      if (String(e.message || '').toLowerCase().includes('webgl')) {
        var f = document.getElementById('fatal');
        if (f) { f.textContent = 'This device could not start 3D graphics. Please try a newer browser with WebGL 2 enabled.'; f.classList.remove('hidden'); }
      }
    }, { once: true });
  </script>
</body>
</html>
